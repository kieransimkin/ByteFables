name: Artwork Unity SRP contracts
on:
  push:
    branches: [main]
    paths: ['tools/artwork_unity_srp.py','scripts/qualify-artwork-unity-srp.py','tests/python/test_artwork_unity_srp.py','integrations/unity/com.bytefables.textures/**','docs/specs/artwork-unity-srp-v1.md','.github/workflows/artwork-unity-srp-contracts.yml']
  pull_request:
    paths: ['tools/artwork_unity_srp.py','scripts/qualify-artwork-unity-srp.py','tests/python/test_artwork_unity_srp.py','integrations/unity/com.bytefables.textures/**','docs/specs/artwork-unity-srp-v1.md','.github/workflows/artwork-unity-srp-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install "Pillow==12.3.0"
      - run: python -m unittest discover -s tests/python -p test_artwork_unity_srp.py -v
