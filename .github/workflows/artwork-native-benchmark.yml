name: Artwork native compositor benchmark
on:
  push:
    branches: [main]
    paths:
      - 'src/engine/artwork-*.ts'
      - 'integrations/framerudiments/**'
      - 'integrations/web/artwork-assets/**'
      - 'integrations/web/artwork-textures/**'
      - 'integrations/web/artwork-alpha-textures/**'
      - 'integrations/web/artwork-ktx2/**'
      - 'integrations/unity/**'
      - 'tests/dotnet/**'
      - 'tests/helpers/artwork_unity_fixture.py'
      - 'tests/browser/artwork-*-smoke.py'
      - 'tests/vectors/artwork-textures-v1.json'
      - 'tests/vectors/artwork-alpha-textures-v1.json'
      - 'tests/vectors/artwork-ktx2-v1.json'
      - 'tools/artwork_*.py'
      - 'scripts/*artwork*'
      - 'tests/*artwork*'
      - 'tests/python/test_artwork*'
      - '.github/workflows/artwork-native-benchmark.yml'
  pull_request:
    paths:
      - 'src/engine/artwork-*.ts'
      - 'integrations/framerudiments/**'
      - 'integrations/web/artwork-assets/**'
      - 'integrations/web/artwork-textures/**'
      - 'integrations/web/artwork-alpha-textures/**'
      - 'integrations/web/artwork-ktx2/**'
      - 'integrations/unity/**'
      - 'tests/dotnet/**'
      - 'tests/helpers/artwork_unity_fixture.py'
      - 'tests/browser/artwork-*-smoke.py'
      - 'tests/vectors/artwork-textures-v1.json'
      - 'tests/vectors/artwork-alpha-textures-v1.json'
      - 'tests/vectors/artwork-ktx2-v1.json'
      - 'tools/artwork_*.py'
      - 'scripts/*artwork*'
      - 'tests/*artwork*'
      - 'tests/python/test_artwork*'
      - '.github/workflows/artwork-native-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-image-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BYTEFABLES_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: kieransimkin/FrameRudiments
          # Explicit integration baseline, not a moving main branch.
          ref: de0b4bb37e3b0b827f3367dac40eae4fe9faa0d7
          path: _host/FrameRudiments
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install real native host and public artwork plugin
        run: python -m pip install --disable-pip-version-check "Pillow==12.3.0" "numpy>=1.26" ./_host/FrameRudiments -e ./integrations/framerudiments
      - run: node --test tests/artwork-native-benchmark.test.mjs tests/artwork-asset-gallery.test.mjs tests/artwork-texture-runtime.test.mjs tests/artwork-alpha-textures.test.mjs tests/artwork-ktx2.test.mjs
      - name: Lossless PNG WebP ICO codecs and bundle boundaries
        run: python -m unittest discover -s tests/python -p test_artwork_image_assets.py -v
      - name: Texture atlas packing and saved-file verification
        run: python -m unittest discover -s tests/python -p test_artwork_texture_bundle.py -v
      - name: Isolated alpha mip arithmetic and texture-array bundle checks
        run: python -m unittest discover -s tests/python -p test_artwork_alpha_textures.py -v
      - name: KTX2 framing, source binding and malformed input
        run: python -m unittest discover -s tests/python -p test_artwork_ktx2.py -v
      - name: Required native integration (missing host is a failure, never a skip)
        run: python -m unittest discover -s tests/python -p test_artwork_native_benchmark.py -v
      - run: python -m unittest discover -s tests/python -p test_artwork_atlas_readback.py -v
      - name: Transparent source alpha and required native matte qualification tests
        run: python -m unittest discover -s tests/python -p test_artwork_transparent_bundle.py -v
      - name: Prepare real TS public atlas plans
        run: node scripts/prepare-artwork-benchmark.mjs --confirm-public --count 16 --output _work/artwork-suite
      - name: Render native PNG contact sheets and verify saved pixels
        run: python scripts/benchmark-artwork-atlas.py --confirm-public --synthetic-fixture --suite _work/artwork-suite/suite.json --output _work/artwork-benchmark --samples 2
      - name: Export verified native PNG WebP ICO asset bundles
        run: python scripts/export-artwork-assets.py --confirm-public export --suite _work/artwork-suite/suite.json --benchmark _work/artwork-benchmark --output _work/artwork-assets
      - name: Independently re-read every saved image asset
        run: python scripts/export-artwork-assets.py --confirm-public verify --bundle _work/artwork-assets
      - name: Export source RGBA with saved native matte verification
        run: python scripts/export-artwork-transparent.py --confirm-public export --suite _work/artwork-suite/suite.json --benchmark _work/artwork-benchmark --output _work/artwork-transparent
      - name: Reopen and verify every transparent PNG WebP ICO
        run: python scripts/export-artwork-transparent.py --confirm-public verify --bundle _work/artwork-transparent
      - name: Qualify saved RGBA on native black and white compositors
        run: python scripts/export-artwork-transparent.py --confirm-public qualify --suite _work/artwork-suite/suite.json --benchmark _work/artwork-benchmark --bundle _work/artwork-transparent --output _work/artwork-transparent-qualified
      - name: Pack native assets into runtime textures
        run: python scripts/export-artwork-textures.py --confirm-public export --bundle _work/artwork-assets --output _work/artwork-textures --native-size 16 --page-size 256
      - name: Verify texture pages against original native image assets
        run: python scripts/export-artwork-textures.py --confirm-public verify --bundle _work/artwork-textures --source-bundle _work/artwork-assets
      - name: Pack transparent native sprites into isolated mip arrays
        run: python scripts/export-artwork-alpha-textures.py --confirm-public export --bundle _work/artwork-transparent --output _work/artwork-alpha-textures --native-size 32 --layers-per-bank 64
      - name: Recompute all mip levels from original transparent PNGs
        run: python scripts/export-artwork-alpha-textures.py --confirm-public verify --bundle _work/artwork-alpha-textures --source-bundle _work/artwork-transparent
      - name: Export and verify lossless KTX2 array banks
        run: |
          python scripts/export-artwork-ktx2.py --confirm-public export --bundle _work/artwork-alpha-textures --output _work/artwork-ktx2
          python scripts/export-artwork-ktx2.py --confirm-public verify --bundle _work/artwork-ktx2 --source-bundle _work/artwork-alpha-textures
      - name: Unity staging and qualification-boundary tests
        run: python -m unittest discover -s tests/python -p test_artwork_unity.py -v
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Stage verified images for Unity (no engine execution in this step)
        run: python scripts/stage-artwork-unity.py --confirm-public stage --bundle _work/artwork-ktx2 --output _work/artwork-unity-staged
      - name: Compile and execute the real C# parser on native image data
        run: dotnet run --project tests/dotnet/ByteFables.TextureContracts --configuration Release -- --descriptor _work/artwork-unity-staged/artwork.bftextures
      - name: Install checksum-pinned independent Khronos tools
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/ktx.deb"
      - name: Independent Khronos validation and all-layer all-mip extraction
        run: python scripts/qualify-artwork-ktx2.py --bundle _work/artwork-ktx2 --ktx "$(command -v ktx)" --report _work/artwork-ktx2-khronos.json
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Browser filtering and PNG WebP pixel readback
        run: python tests/browser/artwork-assets-smoke.py --bundle _work/artwork-assets
      - name: Strict-CSP texture loader and 1000-instance Canvas WebGL pixel readback
        run: python tests/browser/artwork-textures-smoke.py --bundle _work/artwork-textures --report _work/artwork-textures-browser.json
      - name: Browser transparent source preview and exact matte readback
        run: python tests/browser/artwork-transparent-smoke.py --bundle _work/artwork-transparent --report _work/artwork-transparent-browser.json
      - name: Required WebGL2 alpha-array mips, blending and layer-isolation readback
        run: python tests/browser/artwork-alpha-textures-smoke.py --bundle _work/artwork-alpha-textures --report _work/artwork-alpha-textures-browser.json
      - name: KTX2 strict-CSP loader and real WebGL2 mip readback
        run: python tests/browser/artwork-ktx2-smoke.py --bundle _work/artwork-ktx2 --source-bundle _work/artwork-alpha-textures --report _work/artwork-ktx2-browser.json
      - name: Upload benchmark evidence (partial runs carry failure.json, not report.json)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artwork-native-benchmark-${{ github.sha }}
          path: |
            _work/artwork-suite
            _work/artwork-benchmark
            _work/artwork-assets
            _work/artwork-textures
            _work/artwork-textures-browser.json
            _work/artwork-transparent
            _work/artwork-transparent-qualified
            _work/artwork-transparent-browser.json
            _work/artwork-alpha-textures
            _work/artwork-alpha-textures-browser.json
            _work/artwork-ktx2
            _work/artwork-ktx2-khronos.json
            _work/artwork-ktx2-browser.json
            _work/artwork-unity-staged
          if-no-files-found: warn
          retention-days: 14
