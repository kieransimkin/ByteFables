name: Artwork Unity real GPU qualification
# Never execute pull-request code on a licensed/self-hosted workstation.
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful main-branch native image-output run containing artwork-ktx2
        type: string
        required: true
      editor_version:
        description: Exact installed Unity 6 version
        type: string
        default: '6000.0.62f1'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/github-script@v8
        id: check
        env:
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.NATIVE_RUN_ID)) throw new Error('Numeric run ID required');
            const id = Number(process.env.NATIVE_RUN_ID);
            if (!Number.isSafeInteger(id)) throw new Error('Run ID out of range');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
            if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/artwork-native-benchmark.yml' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`)
              throw new Error('Only successful main-branch native benchmark artifacts are eligible');
            core.setOutput('sha', run.head_sha);
  unity-gpu:
    needs: source
    runs-on: [self-hosted, unity-gpu]
    timeout-minutes: 35
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR }}
      BYTEFABLES_UNITY_EDITOR_VERSION: ${{ inputs.editor_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow==12.3.0"
      - uses: actions/download-artifact@v8
        with:
          name: artwork-native-benchmark-${{ needs.source.outputs.sha }}
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          path: _work/native-evidence
      - name: Actual Unity import, every mip-layer readback, orientation and source-over
        run: python scripts/qualify-artwork-unity.py --confirm-public --bundle _work/native-evidence/artwork-ktx2 --output _work/unity-qualification
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unity-qualification-${{ github.run_id }}
          path: |
            _work/unity-qualification/report.json
            _work/unity-qualification/failure.json
            _work/unity-qualification/unity-result.json
            _work/unity-qualification/unity-editor.log
            _work/unity-qualification/launcher.log
          if-no-files-found: error
