name: Artwork real UASTC lazy runtime resolution
on:
  workflow_run:
    workflows: ['Artwork real UASTC compression qualification']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  real-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - uses: actions/download-artifact@v8
        with:
          name: artwork-uastc-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: _work/uastc
      - name: Install checksum-pinned Khronos KTX 4.4.2
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/ktx.deb"
      - name: Resolve quality-qualified UASTC banks lazily into canonical runtime KTX2
        run: |
          python scripts/resolve-artwork-runtime.py --confirm-public uastc --bundle _work/uastc --output _work/runtime-uastc --ktx "$(command -v ktx)"
          python scripts/resolve-artwork-runtime.py verify --bundle _work/runtime-uastc
      - name: Compile and execute lazy CSharp contracts on real UASTC-derived runtime
        run: dotnet run --project tests/dotnet/ByteFables.TextureLazyContracts --configuration Release -- --descriptor _work/runtime-uastc/runtime.bfresolved
      - uses: actions/upload-artifact@v6
        with:
          name: artwork-runtime-uastc-${{ github.event.workflow_run.head_sha }}
          path: _work/runtime-uastc
          if-no-files-found: error
          retention-days: 14
