name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/python -p 'test_hash_image_bench.py' -v
  framerudiments-generator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python feature planning invokes bin/bytefables.mjs, which imports dist/.
      # This job runs in a fresh checkout, independently of the Node matrix jobs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "jsonschema>=4.20,<5" "qrcode[pil]>=8.0,<9" "opencv-python-headless>=4.10,<5"
      - run: python -m unittest discover -s tests/python -v
      - run: python scripts/check_manifest_schema.py
      - run: python -m compileall -q integrations/framerudiments/bytefables_framerudiments
