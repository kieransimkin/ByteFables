name: Artwork GPU block format contracts
on:
  push:
    branches: [main]
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'tools/artwork_gpu_formats.py'
      - 'scripts/export-artwork-gpu-formats.py'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/GpuBlockTextureBundle*.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/CompressedTexture*.cs*'
      - 'tests/python/test_artwork_gpu_formats.py'
      - 'tests/dotnet/ByteFables.TextureGpuContracts/**'
      - 'docs/specs/artwork-gpu-block-formats-v1.md'
      - '.github/workflows/artwork-gpu-formats.yml'
  pull_request:
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'tools/artwork_gpu_formats.py'
      - 'scripts/export-artwork-gpu-formats.py'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/GpuBlockTextureBundle*.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/CompressedTexture*.cs*'
      - 'tests/python/test_artwork_gpu_formats.py'
      - 'tests/dotnet/ByteFables.TextureGpuContracts/**'
      - 'docs/specs/artwork-gpu-block-formats-v1.md'
      - '.github/workflows/artwork-gpu-formats.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '8.0.x'}
      - run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - run: python -m unittest discover -s tests/python -p test_artwork_gpu_formats.py -v
      - run: dotnet run --project tests/dotnet/ByteFables.TextureGpuContracts --configuration Release
      - run: python -m compileall -q tools scripts
