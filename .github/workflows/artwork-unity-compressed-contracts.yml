name: Artwork Unity compressed device contracts
on:
  push:
    branches: [main]
    paths:
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/GpuBlockTextureBundleData.cs'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/LazyTextureBundleData.cs'
      - 'integrations/unity/com.bytefables.textures/Runtime/CompressedTextureDeviceQualification.cs*'
      - 'integrations/unity/com.bytefables.textures/Editor/CompressedTextureDeviceBuild.cs*'
      - 'tools/artwork_unity_compressed_device.py'
      - 'scripts/qualify-artwork-unity-compressed.py'
      - 'tests/python/test_artwork_unity_compressed.py'
      - 'tests/dotnet/ByteFables.TextureGpuContracts/**'
      - 'docs/specs/artwork-unity-compressed-device-v1.md'
      - '.github/workflows/artwork-unity-compressed-contracts.yml'
  pull_request:
    paths:
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/GpuBlockTextureBundleData.cs'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/LazyTextureBundleData.cs'
      - 'integrations/unity/com.bytefables.textures/Runtime/CompressedTextureDeviceQualification.cs*'
      - 'integrations/unity/com.bytefables.textures/Editor/CompressedTextureDeviceBuild.cs*'
      - 'tools/artwork_unity_compressed_device.py'
      - 'scripts/qualify-artwork-unity-compressed.py'
      - 'tests/python/test_artwork_unity_compressed.py'
      - 'tests/dotnet/ByteFables.TextureGpuContracts/**'
      - 'docs/specs/artwork-unity-compressed-device-v1.md'
      - '.github/workflows/artwork-unity-compressed-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-24.04, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '8.0.x'}
      - run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - run: python -m unittest discover -s tests/python -p test_artwork_unity_compressed.py -v
      - name: Compile the expanded Core parser surface
        run: dotnet run --project tests/dotnet/ByteFables.TextureGpuContracts --configuration Release
