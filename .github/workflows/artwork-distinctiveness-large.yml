name: Artwork large unique-identity distinctiveness study
on:
  workflow_dispatch:
    inputs:
      identity_count:
        description: Number of unique public identity digests to render before family/style expansion
        type: choice
        options: ['64','128','256']
        default: '128'
        required: true
permissions:
  contents: read
jobs:
  large-corpus:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BYTEFABLES_REQUIRE_NATIVE: '1'
      IDENTITY_COUNT: ${{ inputs.identity_count }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: kieransimkin/FrameRudiments
          ref: de0b4bb37e3b0b827f3367dac40eae4fe9faa0d7
          path: _host/FrameRudiments
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check "Pillow==12.3.0" "numpy>=1.26" ./_host/FrameRudiments -e ./integrations/framerudiments
      - name: Prepare large public identity suite
        run: node scripts/prepare-artwork-benchmark.mjs --confirm-public --count "$IDENTITY_COUNT" --output _work/artwork-suite
      - name: Render native transparent source corpus
        run: |
          python scripts/benchmark-artwork-atlas.py --confirm-public --synthetic-fixture --suite _work/artwork-suite/suite.json --output _work/artwork-benchmark --samples 2
          python scripts/export-artwork-transparent.py --confirm-public export --suite _work/artwork-suite/suite.json --benchmark _work/artwork-benchmark --output _work/artwork-transparent
          python scripts/export-artwork-transparent.py --confirm-public verify --bundle _work/artwork-transparent
      - name: Analyse unique-identity collision distributions
        run: python scripts/benchmark-artwork-distinctiveness.py --bundle _work/artwork-transparent --output _work/distinctiveness --sizes 16,32,64,128 --preview-size 64 --top-pairs 200
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artwork-distinctiveness-large-${{ inputs.identity_count }}-${{ github.run_id }}
          path: |
            _work/distinctiveness
            _work/artwork-suite/suite.json
            _work/artwork-transparent/manifest.json
          if-no-files-found: warn
          retention-days: 30
