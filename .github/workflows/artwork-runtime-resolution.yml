name: Artwork lazy runtime resolution contracts
on:
  push:
    branches: [main]
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'tools/artwork_runtime_resolve.py'
      - 'scripts/resolve-artwork-runtime.py'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/LazyTextureBundleData.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/TextureCpuResidency.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/LazyTextureArrayResidency.cs*'
      - 'tests/python/test_artwork_runtime_resolution.py'
      - 'tests/dotnet/ByteFables.TextureLazyContracts/**'
      - 'docs/specs/artwork-runtime-resolution-v1.md'
      - 'docs/specs/artwork-ktx2-uastc-v1.md'
      - '.github/workflows/artwork-runtime-resolution.yml'
  pull_request:
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'tools/artwork_runtime_resolve.py'
      - 'scripts/resolve-artwork-runtime.py'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/LazyTextureBundleData.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/Core/TextureCpuResidency.cs*'
      - 'integrations/unity/com.bytefables.textures/Runtime/LazyTextureArrayResidency.cs*'
      - 'tests/python/test_artwork_runtime_resolution.py'
      - 'tests/dotnet/ByteFables.TextureLazyContracts/**'
      - 'docs/specs/artwork-runtime-resolution-v1.md'
      - 'docs/specs/artwork-ktx2-uastc-v1.md'
      - '.github/workflows/artwork-runtime-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lazy-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install image integration
        run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - name: Runtime resolution and lazy-source Python contracts
        run: python -m unittest discover -s tests/python -p test_artwork_runtime_resolution.py -v
      - name: Build explicit synthetic lossless KTX2 fixture
        run: python tests/helpers/artwork_unity_fixture.py --output _work/lossless-ktx2
      - name: Install checksum-pinned Khronos KTX 4.4.2
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/ktx.deb"
      - name: Resolve lossless source to metadata-first runtime cache
        run: |
          python scripts/resolve-artwork-runtime.py --confirm-public lossless --bundle _work/lossless-ktx2 --output _work/runtime-lossless
          python scripts/resolve-artwork-runtime.py verify --bundle _work/runtime-lossless
      - name: Produce and verify real UASTC source
        run: |
          python scripts/export-artwork-ktx2-basis.py --confirm-public --ktx "$(command -v ktx)" export --bundle _work/lossless-ktx2 --output _work/uastc
          python scripts/export-artwork-ktx2-basis.py --confirm-public --ktx "$(command -v ktx)" verify --bundle _work/uastc --source-bundle _work/lossless-ktx2
      - name: Resolve UASTC source bank-by-bank back to canonical runtime KTX2
        run: |
          python scripts/resolve-artwork-runtime.py --confirm-public uastc --bundle _work/uastc --output _work/runtime-uastc --ktx "$(command -v ktx)"
          python scripts/resolve-artwork-runtime.py verify --bundle _work/runtime-uastc
      - name: Compile and execute lazy CSharp contracts against lossless-derived cache
        run: dotnet run --project tests/dotnet/ByteFables.TextureLazyContracts --configuration Release -- --descriptor _work/runtime-lossless/runtime.bfresolved
      - name: Execute lazy CSharp contracts against UASTC-derived cache
        run: dotnet run --project tests/dotnet/ByteFables.TextureLazyContracts --configuration Release -- --descriptor _work/runtime-uastc/runtime.bfresolved
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artwork-runtime-resolution-${{ github.sha }}
          path: |
            _work/runtime-lossless
            _work/uastc
            _work/runtime-uastc
          if-no-files-found: warn
          retention-days: 14
