name: Artwork compressed KTX2 and streaming contracts
on:
  push:
    branches: [main]
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'scripts/export-artwork-ktx2-basis.py'
      - 'scripts/probe-artwork-uastc.py'
      - 'integrations/web/artwork-streaming/**'
      - 'integrations/unity/com.bytefables.textures/Runtime/TextureArrayResidency.cs*'
      - 'tests/artwork-streaming.test.mjs'
      - 'tests/browser/artwork-streaming-smoke.py'
      - 'tests/python/test_artwork_ktx2_basis.py'
      - 'tests/python/test_artwork_streaming.py'
      - 'tests/python/test_artwork_unity_srp.py'
      - 'docs/specs/artwork-ktx2-uastc-v1.md'
      - 'docs/specs/artwork-streaming-residency-v1.md'
      - '.github/workflows/artwork-compressed-streaming.yml'
  pull_request:
    paths:
      - 'tools/artwork_ktx2_basis.py'
      - 'scripts/export-artwork-ktx2-basis.py'
      - 'scripts/probe-artwork-uastc.py'
      - 'integrations/web/artwork-streaming/**'
      - 'integrations/unity/com.bytefables.textures/Runtime/TextureArrayResidency.cs*'
      - 'tests/artwork-streaming.test.mjs'
      - 'tests/browser/artwork-streaming-smoke.py'
      - 'tests/python/test_artwork_ktx2_basis.py'
      - 'tests/python/test_artwork_streaming.py'
      - 'tests/python/test_artwork_unity_srp.py'
      - 'docs/specs/artwork-ktx2-uastc-v1.md'
      - 'docs/specs/artwork-streaming-residency-v1.md'
      - '.github/workflows/artwork-compressed-streaming.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compressed-streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ByteFables image integration and test dependencies
        run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - name: UASTC protocol and failure-boundary tests
        run: python -m unittest discover -s tests/python -p test_artwork_ktx2_basis.py -v
      - name: Streaming and Unity residency source contracts
        run: python -m unittest discover -s tests/python -p test_artwork_streaming.py -v
      - name: Browser cache policy contracts
        run: node --test tests/artwork-streaming.test.mjs
      - name: Build explicit synthetic lossless KTX2 fixture
        run: python tests/helpers/artwork_unity_fixture.py --output _work/lossless-ktx2
      - name: Install checksum-pinned Khronos KTX 4.4.2
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/ktx.deb"
      - name: Real UASTC codec protocol smoke on synthetic orientation fixture
        run: python scripts/probe-artwork-uastc.py --bundle _work/lossless-ktx2 --ktx "$(command -v ktx)" --report _work/uastc-protocol.json
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Required same-origin bank streaming and one-bank LRU eviction
        run: python tests/browser/artwork-streaming-smoke.py --bundle _work/lossless-ktx2 --report _work/streaming-browser.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: artwork-compressed-streaming-${{ github.sha }}
          path: |
            _work/uastc-protocol.json
            _work/streaming-browser.json
          if-no-files-found: warn
          retention-days: 14
