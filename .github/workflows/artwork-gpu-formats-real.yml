name: Artwork real GPU block format packaging
on:
  workflow_run:
    workflows: ['Artwork real UASTC compression qualification']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  gpu-blocks:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -e ./integrations/framerudiments "Pillow==12.3.0"
      - uses: actions/download-artifact@v8
        with:
          name: artwork-uastc-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: _work/uastc
      - name: Install checksum-pinned Khronos KTX 4.4.2
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$RUNNER_TEMP/ktx.deb" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/ktx.deb"
      - name: Transcode every real bank/mip/layer to BC7 ASTC4x4 and ETC2_RGBA8
        run: |
          python scripts/export-artwork-gpu-formats.py --confirm-public --ktx "$(command -v ktx)" export --bundle _work/uastc --output _work/gpu-blocks
          python scripts/export-artwork-gpu-formats.py --ktx "$(command -v ktx)" verify --bundle _work/gpu-blocks --source-uastc _work/uastc
      - uses: actions/upload-artifact@v6
        with:
          name: artwork-gpu-blocks-${{ github.event.workflow_run.head_sha }}
          path: _work/gpu-blocks
          if-no-files-found: error
          retention-days: 14
