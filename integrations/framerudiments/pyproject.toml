[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytefables-framerudiments"
version = "0.1.0"
description = "Public-only ByteFables generator plugin for FrameRudiments"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
host = ["framerudiments>=0.4.11,<0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bytefables_framerudiments*"]
